name: CI Windows

# Windows qualification. This does not replace the Ubuntu workflow, the
# 15-attempt Qt stability gate, or a manual desktop acceptance. windows-2022
# is pinned so windows-latest cannot move the image. See ADR-53.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: windows test (cp${{ matrix.python-version }})
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Keep repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with the dev extra)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/development.txt -c constraints/build.txt -e ".[dev]"

      - name: Ruff lint
        shell: pwsh
        run: python -m ruff check .

      - name: Ruff format
        shell: pwsh
        run: python -m ruff format --check .

      # The same core boundary is type-checked on Windows as on Linux, so a type error that
      # only appears on one platform cannot hide behind the other one's green run.
      - name: Type-check the core boundary
        if: matrix.python-version == '3.11'
        shell: pwsh
        run: python -m mypy

      # The pinned dependency set is audited against the advisory service.
      # A known vulnerability fails the job. An advisory-service outage is a
      # warning and a record, not a failure: a third-party outage is not a
      # defect in this repository, and it is still recorded so that it cannot
      # be mistaken for a clean audit.
      - name: Audit the pinned dependencies
        run: |
          python -m pip install "pip-audit>=2.9,<3"
          python tools/dependency_audit.py --output dependency-audit.json

      - name: Byte-compile source, tests, migrations and tools
        shell: pwsh
        run: python -m compileall -q src tests migrations tools

      - name: Alembic has exactly one head
        shell: pwsh
        run: |
          $raw = python -m alembic heads
          $raw | Write-Output
          $count = @($raw | Select-String -Pattern '\(head\)').Count
          if ($count -ne 1) {
            Write-Error "expected exactly one alembic head, found $count"
            exit 1
          }

      - name: Test suite
        shell: pwsh
        run: python tools/ci_pytest.py -- --junitxml=pytest-junit.xml

      - name: Count datetime adapter warnings
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path pytest-output.txt)) {
            Write-Error "pytest-output.txt is missing"
            exit 1
          }
          $adapter = @(Select-String -Path pytest-output.txt -Pattern "default datetime adapter" -SimpleMatch -Encoding utf8).Count
          $summary = Select-String -Path pytest-output.txt -Pattern '[0-9]+ warnings? in ' -Encoding utf8 | Select-Object -Last 1
          Write-Output "::notice::datetime-adapter-warnings: $adapter"
          if ($summary) {
            Write-Output "::notice::$($summary.Line)"
          } else {
            Write-Output "::notice::pytest warning summary line absent"
          }
          if ($adapter -ne 0) {
            Write-Error "deprecated sqlite datetime adapter warning remains: $adapter"
            exit 1
          }

      - name: Record test totals
        if: always()
        shell: pwsh
        run: python tools/pytest_totals.py --stats pytest-totals.json --junit pytest-junit.xml --exit-file pytest-exit.txt

      - name: Publish pytest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-windows-cp${{ matrix.python-version }}
          path: |
            pytest-output.txt
            pytest-junit.xml
            pytest-totals.json
            pytest-exit.txt
            dependency-audit.json
          if-no-files-found: error

      - name: Surface failures as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path pytest-output.txt) {
            Select-String -Path pytest-output.txt -Pattern '^(FAILED|ERROR) ' | Select-Object -First 50 | ForEach-Object {
              Write-Output "::error::$($_.Line)"
            }
          }

      - name: Working tree was not rewritten
        if: always()
        shell: pwsh
        run: |
          git diff --check
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Error "working tree changed during the job"
            Write-Output $dirty
            exit 1
          }

  release-smoke:
    name: windows clean install smoke
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Keep repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/development.txt -c constraints/build.txt -e ".[dev]"

      - name: Build, clean-install and exercise the package
        shell: pwsh
        run: python tools/release_smoke.py

      - name: Disposable owner pilot
        shell: pwsh
        run: .\tools\windows_pilot.ps1 -Python python -RepoRoot (Get-Location).Path

  ui:
    name: windows ui (offscreen Qt)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Keep repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install (editable, with the ui extra)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ui.txt -c constraints/build.txt -e ".[dev,ui]"

      - name: Probe the real Qt platform
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path qt-logs | Out-Null
          python -c "import pathlib, platform; import PySide6; from PySide6.QtCore import qVersion; from PySide6.QtWidgets import QApplication; app = QApplication([]); text = ' '.join(['qt-platform', app.platformName(), 'python', platform.python_version(), 'pyside', PySide6.__version__, 'qt', qVersion()]); pathlib.Path('qt-logs/versions.txt').write_text(text + chr(10), encoding='utf-8'); print(text)"
          if (-not (Test-Path qt-logs/versions.txt) -or (Get-Item qt-logs/versions.txt).Length -lt 1) {
            Write-Error "Qt version probe wrote no versions.txt"
            exit 1
          }

      - name: Offscreen UI tests
        shell: pwsh
        run: python tools/ci_pytest.py --output qt-logs/pytest-output.txt --exit-file qt-logs/pytest-exit.txt -- tests/ui --junitxml=qt-logs/pytest-junit.xml

      # The fail-closed shutdown is the one path that has faulted natively on
      # Windows. This experiment repeats it and reports every attempt: a later
      # attempt that honours the contract does not erase an earlier native
      # fault. It is not a retry of the UI suite.
      #
      # The known native access violation is MEASURED here, not gated. It is
      # an open defect with a measured rate (see docs/mission-reports/
      # END_TO_END_FINAL_REPORT.md), and gating a required job on a fault
      # that fires in a few percent of attempts would make the job a coin
      # toss and the run meaningless. Every native fault is still reported at
      # error level with the stage the child reached, the count and the rate
      # are published as a notice, and the transcripts are in the artifact.
      # Any failure that is NOT the known native fault still fails this step.
      - name: Fail-closed shutdown stress
        shell: pwsh
        run: |
          python tools/qt_shutdown_stress.py --attempts 25 --log-dir qt-logs/shutdown-stress

      - name: Surface UI failures
        if: always()
        shell: pwsh
        run: |
          if (Test-Path qt-logs/pytest-output.txt) {
            Select-String -Path qt-logs/pytest-output.txt -Pattern '^(FAILED|ERROR) ' | Select-Object -First 40 | ForEach-Object {
              Write-Output "::error::$($_.Line)"
            }
          }

      - name: Record UI totals
        if: always()
        shell: pwsh
        run: python tools/pytest_totals.py --stats pytest-totals.json --junit qt-logs/pytest-junit.xml --exit-file qt-logs/pytest-exit.txt

      - name: Publish Windows UI logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-windows-ui-logs
          path: |
            qt-logs/
            pytest-totals.json
          if-no-files-found: error
