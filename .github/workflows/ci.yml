name: CI

# ADR-0002 states that "two runtimes are exercised in CI as the floor moves" - the floor is
# CPython 3.11 and the product target is 3.14.  This workflow is what makes that sentence true;
# before it existed the claim had no CI behind it at all.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (cp${{ matrix.python-version }})
    # ubuntu-latest moves to Ubuntu 26 starting 2026-10-19. The release baseline
    # stays ubuntu-24.04. ubuntu-26.04 is a separate required compatibility lane,
    # not a substitute for this job. A failure there fails the workflow.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor and the target, per ADR-0002.  Code must not use anything newer than the
        # floor, and this matrix is how that is enforced rather than asserted.
        python-version: ["3.11", "3.14"]
        include:
          # The coverage baseline is measured once, on the floor runtime.  It is a recorded
          # number, not a gate: no threshold is enforced, because no measured baseline existed
          # to set one against.  See docs/mission-reports/END_TO_END_FINAL_REPORT.md.
          - python-version: "3.11"
            coverage-flags: "--cov --cov-report=term --cov-report=xml:coverage.xml"
          - python-version: "3.14"
            coverage-flags: ""
    steps:
      # Full history, not the default depth-1.  `test_report_integrity` asserts that every
      # full-length commit SHA cited in the certification reports actually exists in the object
      # database - a real guarantee against a report naming a commit that was never pushed - and a
      # shallow clone cannot answer it, so the test failed in CI while passing locally.  The fix
      # belongs here: the assertion is correct, the checkout was too thin to evaluate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with the dev extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/development.txt -c constraints/build.txt -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      # The checked boundaries are drilling_intelligence.core, .database and
      # .extraction.  The rules live in pyproject.toml under [tool.mypy]; the
      # boundary is widened by a separate, dated change.
      - name: Type-check the checked boundaries
        if: matrix.python-version == '3.11'
        run: python -m mypy

      # The pin files are checked against the metadata, not trusted.  The check
      # re-resolves each set in a throwaway virtual environment, so it costs about
      # a minute and it needs the index.  A new upstream patch release therefore
      # turns this step red **by design**: the pins are a decision to be renewed,
      # not a value that follows the index.  The remedy is one command per set
      # (`python tools/constraints.py --set <name>`) and a CI run on the new SHA.
      # The comparison ignores the generation date the file carries, so a step
      # that ran on a later day than the regeneration does not fail for that.
      - name: The pins still resolve to what the files say
        if: matrix.python-version == '3.11'
        run: |
          for set_name in runtime development ui build audit; do
            python tools/constraints.py --set "${set_name}" --check
          done

      # The pinned dependency set is audited against the advisory service.
      # A known vulnerability fails the job. An advisory-service outage is a
      # warning and a record, not a failure: a third-party outage is not a
      # defect in this repository, and it is still recorded so that it cannot
      # be mistaken for a clean audit.
      - name: Audit the pinned dependencies
        if: matrix.python-version == '3.11'
        run: |
          # The auditor is pinned (constraints/audit.txt) and installed into an
          # environment of its own: a floating range would let the tool change
          # between two runs of the same commit, and installing it into the
          # product's environment could move a version the product is tested
          # with.  The audit itself reads the pins, not the environment.
          #
          # The environment lives outside the checkout.  It was built inside it
          # at first, and the Windows job's "working tree was not rewritten"
          # check then failed - the job had created an untracked directory in
          # the tree it was inspecting.  Build the tool where it belongs: in the
          # runner's temporary directory.
          audit_venv="$RUNNER_TEMP/audit-venv"
          python -m venv "$audit_venv"
          "$audit_venv/bin/python" -m pip install --upgrade pip
          "$audit_venv/bin/python" -m pip install -c constraints/audit.txt pip-audit
          python tools/dependency_audit.py --output dependency-audit.json --python "$audit_venv/bin/python"

      # migrations/ is compiled too: a migration script is production code and a syntax error in
      # one is a release defect, not a test-time surprise.
      - name: Byte-compile source, tests and migrations
        run: python -m compileall -q src tests migrations

      - name: Alembic has exactly one head
        run: |
          alembic heads
          test "$(alembic heads | grep -c '(head)')" -eq 1

      - name: Test suite
        # The desktop UI tests skip themselves when Qt cannot load, which is the intended headless
        # behaviour - this job does not install the optional `ui` extra, and a skip is reported as
        # a skip rather than being dressed up as a pass. One quiet level comes from pytest addopts;
        # a second -q would hide the summary line. The session-stats file and JUnit are the
        # durable totals if that line is lost; both are required after the process exits.
        run: |
          set -o pipefail
          set +e
          pytest ${{ matrix.coverage-flags }} --junitxml=pytest-junit.xml 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > pytest-exit.txt
          exit "$status"

      # The artifact host is not a substitute for this check. The step reads the
      # pytest output the job just wrote and fails if the deprecated adapter remains.
      - name: Count datetime adapter warnings
        if: always()
        run: |
          set -euo pipefail
          test -f pytest-output.txt
          adapter=$(grep -c "default datetime adapter" pytest-output.txt || true)
          summary=$(grep -E "[0-9]+ warnings? in " pytest-output.txt | tail -1 || true)
          echo "::notice::datetime-adapter-warnings: ${adapter}"
          if [ -n "${summary}" ]; then
            echo "::notice::${summary}"
          else
            echo "::notice::pytest warning summary line absent"
          fi
          if [ "${adapter}" != "0" ]; then
            echo "::error::deprecated sqlite datetime adapter warning remains: ${adapter}"
            exit 1
          fi

      # Totals are required on a green run and still published when pytest fails midway.
      - name: Record test totals
        if: always()
        run: python tools/pytest_totals.py --stats pytest-totals.json --junit pytest-junit.xml --exit-file pytest-exit.txt

      # The coverage baseline is a recorded number, not a gate.  It is published as a notice
      # so it can be read from the run page and from the API without downloading the
      # artifact, and the full per-module report goes to the step summary.
      #
      # A total is not a reading.  tools/coverage_report.py adds the package-level view
      # and the comparison with the recorded baseline, and it says which optional
      # dependency was absent from this environment - because "the Qt layer is 0%"
      # and "the Qt layer was not measured, Qt is not installed here" are different
      # claims and only one of them is true in this job.
      - name: Record the coverage baseline
        if: always() && matrix.python-version == '3.11'
        run: |
          if [ ! -f .coverage ]; then
            echo "::notice::coverage-total: not measured"
            echo "::notice::coverage-groups: not measured"
            exit 0
          fi
          total=$(python -m coverage report --format=total)
          echo "::notice::coverage-total: ${total}%"
          {
            echo "### Coverage baseline"
            echo ""
            echo "Line and branch coverage, CPython 3.11: ${total}%"
            echo ""
            python -m coverage report
          } >> "$GITHUB_STEP_SUMMARY"
          python tools/coverage_report.py --xml coverage.xml --scope full-suite --test-selection "pytest (full suite)" \
            --output coverage-report.md --json coverage-view.json \
            --label "CI test (cp3.11), ${{ github.sha }}" | tee coverage-report.txt
          {
            echo ""
            # Everything after the overall table: the groups, the optional
            # dependencies of this measurement, and the comparison.  One range,
            # so the section headings are not repeated.
            sed -n '/^## By package group/,$p' coverage-report.md
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          view = json.loads(Path("coverage-view.json").read_text(encoding="utf-8"))
          print()
          print("### Coverage by group, as one line per group")
          print()
          for name, group in sorted(view["groups"].items()):
              line = group["line_percent"]
              branch = group["branch_percent"]
              stmts = group["statements"]
              br = group["branches"]
              # Qualify empty groups explicitly rather than printing 100% of nothing
              line_str = f"{line}% (not measured)" if stmts == 0 else f"{line}%"
              branch_str = f"{branch}% (not measured)" if br == 0 else f"{branch}%"
              print(f"- `{name}`: {line_str} lines, {branch_str} branches ({group['files']} files, {stmts} stmts)")
          absent = [fact["name"] for fact in view["optional_dependencies"] if not fact["present"]]
          print()
          print(f"optional dependencies absent from this environment: {', '.join(absent) or 'none'}")
          print()
          ui = view["groups"].get("qt/ui", {})
          print(f"full-suite line/branch: {view['overall']['line_percent']}% / {view['overall']['branch_percent']}%")
          print(f"qt/ui package (headless, so not measured): {ui.get('line_percent', 0)}% lines, {ui.get('branch_percent', 0)}% branches")
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          view = json.loads(Path("coverage-view.json").read_text(encoding="utf-8"))
          ui = view["groups"].get("qt/ui", {})
          overall = view["overall"]
          print(f"::notice::coverage-full-suite: {overall['line_percent']}% lines, {overall['branch_percent']}% branches (full suite)")
          if ui.get("statements", 0) == 0:
              print(f"::notice::coverage-ui-package: not measured (0 statements, Qt not installed in headless job)")
          else:
              print(f"::notice::coverage-ui-package: {ui.get('line_percent', 0)}% lines, {ui.get('branch_percent', 0)}% branches (qt/ui package, headless)")
          PY

      - name: Publish the coverage baseline
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cp3.11
          path: |
            coverage.xml
            coverage-report.md
            coverage-view.json
            coverage-report.txt
          if-no-files-found: warn

      - name: Publish pytest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-cp${{ matrix.python-version }}
          path: |
            pytest-output.txt
            pytest-junit.xml
            pytest-totals.json
            pytest-exit.txt
            dependency-audit.json
          if-no-files-found: error

      # A red run has to say *what* failed without anyone having to open the raw log, so each
      # failure is re-emitted as a workflow annotation and a short summary lands on the run page.
      - name: Surface failures as annotations
        if: failure()
        run: |
          if [ -f pytest-output.txt ]; then
            grep -E "^(FAILED|ERROR) " pytest-output.txt | head -50 | while read -r line; do
              echo "::error::${line}"
            done
            {
              echo "### Test failures"
              echo '```'
              grep -E "^(FAILED|ERROR) " pytest-output.txt | head -50
              tail -40 pytest-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

  release-smoke:
    name: clean install smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/development.txt -c constraints/build.txt -e ".[dev]"

      # Builds the wheel and the sdist, installs each into a fresh virtualenv outside this
      # checkout, and drives the installed CLI: workspace creation, schema bootstrap with no
      # migrations/ directory present, well write/read, and the read surfaces.  This is the only
      # job that proves the *installed* product works, as opposed to the source tree.
      - name: Build, clean-install and exercise the package
        run: python tools/release_smoke.py

  workbench:
    name: workbench (offscreen Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Real PySide6 under Xvfb. A missing library or a skipped UI test fails this job.
      # It is not a skip dressed up as a pass, and the headless test job above does not
      # install this extra.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libx11-6 \
            libxcb1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 \
            libxrender1 libxtst6 libnss3 libsm6 libice6
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install (editable, with the ui extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ui.txt -c constraints/build.txt -e ".[dev,ui]"

      - name: Probe the real Qt platform
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_OPENGL: software
          QT_QPA_PLATFORM: offscreen
          QT_X11_NO_MITSHM: "1"
        run: |
          set -o pipefail
          mkdir -p qt-logs
          xvfb-run -a -s "-screen 0 1280x1024x24" python -c "import platform; import PySide6; from PySide6.QtCore import qVersion; from PySide6.QtWidgets import QApplication; app = QApplication([]); print('qt-platform', app.platformName(), 'python', platform.python_version(), 'pyside', PySide6.__version__, 'qt', qVersion())" | tee qt-logs/versions.txt
          test -s qt-logs/versions.txt

      - name: Offscreen workbench tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_OPENGL: software
          QT_QPA_PLATFORM: offscreen
          QT_X11_NO_MITSHM: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: python tools/qt_workbench.py

      # The coverage of the Qt layer, measured where Qt is real. The headless test job
      # above measures everything else. This is a required gate: 70% lines and 40% branches for qt/ui.
      - name: Measure the coverage of the Qt layer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_OPENGL: software
          QT_QPA_PLATFORM: offscreen
          QT_X11_NO_MITSHM: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          set +e
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest --cov --cov-branch --cov-report=term --cov-report=xml:coverage-ui.xml tests/ui tests/unit/test_qt_termination.py tests/unit/test_qt_termination_edge.py tests/unit/test_qt_lifetime_contract.py tests/unit/test_qt_wait_matrix.py tests/unit/test_qt_workbench_policy.py tests/unit/test_ui_coverage_boost.py tests/unit/test_ui_coverage_boost_extra.py tests/unit/test_ui_coverage_boost_v21.py tests/unit/test_main_window_mocked_coverage.py tests/unit/test_ui_coverage_boost_v22.py tests/unit/test_ui_coverage_boost_v23.py \
            2>&1 | tee pytest-ui-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > pytest-ui-exit.txt
          exit "$status"

      - name: Record the Qt layer coverage
        if: always()
        run: |
          if [ ! -f coverage-ui.xml ]; then
            echo "::error::coverage-ui.xml missing — required Qt/UI coverage was not produced"
            exit 1
          fi
          if [ ! -f .coverage ]; then
            echo "::error::.coverage missing — coverage data was not produced"
            exit 1
          fi
          total=$(python -m coverage report --format=total)
          echo "::notice::coverage-ui-total: ${total}%"
          {
            echo "### Coverage of the Qt layer"
            echo ""
            echo "Line and branch coverage of the UI tests, CPython 3.11: ${total}%"
            echo "This number is the whole-source coverage *during* the UI run, not the UI package alone."
            echo ""
            python -m coverage report
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage-ui.xml ]; then
            python tools/coverage_report.py --xml coverage-ui.xml --scope ui-test-selection --test-selection "tests/ui + tests/unit/test_qt_termination.py + tests/unit/test_qt_termination_edge.py + tests/unit/test_qt_lifetime_contract.py + tests/unit/test_qt_wait_matrix.py + tests/unit/test_qt_workbench_policy.py + tests/unit/test_ui_coverage_boost.py + tests/unit/test_ui_coverage_boost_extra.py + tests/unit/test_ui_coverage_boost_v21.py + tests/unit/test_main_window_mocked_coverage.py + tests/unit/test_ui_coverage_boost_v22.py + tests/unit/test_ui_coverage_boost_v23.py (Qt offscreen)" \
              --output coverage-ui-report.md --json coverage-ui-view.json \
              --label "CI ui (cp3.11), ${{ github.sha }}" | tee coverage-ui-report.txt
            {
              echo ""
              sed -n '/^## By package group/,$p' coverage-ui-report.md
            } >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          view = json.loads(Path("coverage-ui-view.json").read_text(encoding="utf-8"))
          ui = view["groups"].get("qt/ui", {})
          overall = view["overall"]
          print()
          print("### UI package vs whole-source during the UI run")
          print()
          # overall may be None for not measured, handle
          overall_line = overall.get('line_percent')
          overall_branch = overall.get('branch_percent')
          ui_line = ui.get('line_percent')
          ui_branch = ui.get('branch_percent')
          print(f"- whole-source during UI run: {overall_line if overall_line is not None else '—'}% lines, {overall_branch if overall_branch is not None else '—'}% branches")
          print(f"- `qt/ui` package alone: {ui_line if ui_line is not None else '—'}% lines, {ui_branch if ui_branch is not None else '—'}% branches ({ui.get('files', 0)} files)")
          print(f"- `qt/ui` statements: {ui.get('covered_statements', 0)}/{ui.get('statements', 0)}")
          print(f"- `qt/ui` branches: {ui.get('covered_branches', 0)}/{ui.get('branches', 0)}")
          print(f"- platform: {view.get('platform', 'unknown')} — Python: {view.get('python_version', 'unknown')} — Coverage: {view.get('coverage_version', 'unknown')}")
          print(f"- fingerprint: {view.get('test_selection_fingerprint', '')}")
          PY
            python - <<'PY'
          import json
          from pathlib import Path
          view = json.loads(Path("coverage-ui-view.json").read_text(encoding="utf-8"))
          ui = view["groups"].get("qt/ui", {})
          print(f"::notice::coverage-ui-package: {ui.get('line_percent', 0) if ui.get('line_percent') is not None else '—'}% lines, {ui.get('branch_percent', 0) if ui.get('branch_percent') is not None else '—'}% branches (qt/ui package, UI run)")
          print(f"::notice::coverage-ui-package-statements: {ui.get('covered_statements', 0)}/{ui.get('statements', 0)} (qt/ui)")
          print(f"::notice::coverage-ui-package-branches: {ui.get('covered_branches', 0)}/{ui.get('branches', 0)} (qt/ui)")
          print(f"::notice::coverage-scope: {view.get('measurement_scope')} -- {view.get('test_selection')}")
          PY
          fi

      - name: Qt/UI coverage gate (70% lines, 40% branches)
        if: always()
        run: |
          set -euo pipefail
          test -f coverage-ui-view.json
          test -f coverage-ui.xml
          python - <<'PY'
          import json, sys
          from pathlib import Path
          view = json.loads(Path("coverage-ui-view.json").read_text(encoding="utf-8"))
          # Validate SHA, scope, selection metadata
          import subprocess, pathlib
          head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True).stdout.strip()
          commit = view.get("commit")
          scope = view.get("measurement_scope")
          sel = view.get("test_selection")
          fp = view.get("test_selection_fingerprint")
          overall = view.get("overall", {})
          ui = view.get("groups", {}).get("qt/ui")
          if not ui:
              print("::error::qt/ui group missing from coverage view", file=sys.stderr)
              sys.exit(1)
          print(f"commit in view: {commit}")
          print(f"HEAD: {head}")
          print(f"scope: {scope}")
          print(f"selection: {sel}")
          print(f"fingerprint: {fp}")
          print(f"ui: {ui}")
          # SHA must match (allow short prefix)
          if commit not in (head, head[:12], head[:7]) and head not in commit:
              # But view commit may be short, so check that head starts with commit or vice versa
              if not head.startswith(commit) and not commit.startswith(head):
                  print(f"::error::coverage view commit {commit} does not match HEAD {head}", file=sys.stderr)
                  sys.exit(1)
          if scope != "ui-test-selection":
              print(f"::error::expected scope ui-test-selection, got {scope}", file=sys.stderr)
              sys.exit(1)
          expected_sel = "tests/ui + tests/unit/test_qt_termination.py + tests/unit/test_qt_termination_edge.py + tests/unit/test_qt_lifetime_contract.py + tests/unit/test_qt_wait_matrix.py + tests/unit/test_qt_workbench_policy.py + tests/unit/test_ui_coverage_boost.py + tests/unit/test_ui_coverage_boost_extra.py + tests/unit/test_ui_coverage_boost_v21.py + tests/unit/test_main_window_mocked_coverage.py + tests/unit/test_ui_coverage_boost_v22.py + tests/unit/test_ui_coverage_boost_v23.py (Qt offscreen)"
          if sel != expected_sel:
              print(f"::error::test_selection mismatch: expected '{expected_sel}', got '{sel}'", file=sys.stderr)
              sys.exit(1)
          # Validate file counts
          if ui.get("statements", 0) == 0:
              print("::error::qt/ui statements is 0 — not measured", file=sys.stderr)
              sys.exit(1)
          line = ui.get("line_percent")
          branch = ui.get("branch_percent")
          if line is None or branch is None:
              print(f"::error::qt/ui percent is None (not measured): line {line}, branch {branch}", file=sys.stderr)
              sys.exit(1)
          print(f"qt/ui line {line}% branch {branch}%")
          if line < 70.0:
              print(f"::error::qt/ui line coverage {line}% is below 70% gate", file=sys.stderr)
              sys.exit(1)
          if branch < 40.0:
              print(f"::error::qt/ui branch coverage {branch}% is below 40% gate", file=sys.stderr)
              sys.exit(1)
          print(f"::notice::coverage-gate: PASS qt/ui {line}% lines, {branch}% branches meets 70/40")
          # Resilience headroom is now contractual for V8.23: 71/42.
          # Both thresholds are enforced fail-closed; a below-target measurement
          # fails the job with ::error::, not a warning.
          if line < 71.0:
              print(f"::error::qt/ui line coverage {line}% is below resilience target 71% (V8.23 contractual)", file=sys.stderr)
              sys.exit(1)
          if branch < 42.0:
              print(f"::error::qt/ui branch coverage {branch}% is below resilience target 42% (V8.23 contractual)", file=sys.stderr)
              sys.exit(1)
          print(f"::notice::coverage-resilience: PASS qt/ui {line}% lines, {branch}% branches meets 71/42 headroom (V8.23)")
          # Also validate XML and JSON agree: re-read XML via coverage_report logic is already done, but we can double-check that view matches XML
          # For now, ensure report file exists and contains expected scope
          PY
          echo "coverage gate passed"


      - name: Publish the Qt layer coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ui-cp3.11
          path: |
            coverage-ui.xml
            coverage-ui-report.md
            coverage-ui-view.json
            coverage-ui-report.txt
            pytest-ui-output.txt
            pytest-ui-exit.txt
          if-no-files-found: error

      # Qualification, not a silent rerun. Each iteration is independent. A
      # failed iteration fails the job even if a later one passes.
      - name: Qt stability qualification
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_OPENGL: software
          QT_QPA_PLATFORM: offscreen
          QT_X11_NO_MITSHM: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: python tools/qt_stability.py --repeats 15

      # The fail-closed shutdown is the one path that has faulted natively on
      # Windows. The same experiment runs here so the two platforms are
      # compared on the same contract, and every attempt is reported.
      - name: Fail-closed shutdown stress
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_OPENGL: software
          QT_QPA_PLATFORM: offscreen
          QT_X11_NO_MITSHM: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        # --gate: on Linux the native access violation cannot occur, so any failure
        # here is a contract violation and must fail the job.
        run: python tools/qt_shutdown_stress.py --attempts 10 --log-dir qt-logs/shutdown-stress --gate

      # Hash the logs that exist. A mismatch, a missing attempt, or an abort
      # signature inside a successful record fails the job. The checksum is not
      # an entry in the manifest it covers.
      - name: Verify Qt evidence archive
        if: always()
        run: python tools/qt_evidence.py qt-logs --write --repeats 15

      # The attempt logs are release evidence. A green workbench job must not
      # waive a failed upload or a missing log directory.
      - name: Publish Qt attempt logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-workbench-logs
          path: qt-logs/
          if-no-files-found: error

  ubuntu-2604:
    name: Ubuntu 26.04 compatibility
    # Required lane. A failure here fails the workflow. It does not move the
    # ubuntu-24.04 release baseline. CPython 3.14 on this image is uncertified
    # until a runner executes it; this job is 3.11.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libx11-6 \
            libxcb1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 \
            libxrender1 libxtst6 libnss3 libsm6 libice6
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install (editable, with the ui extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ui.txt -c constraints/build.txt -e ".[dev,ui]"

      - name: Probe the real Qt platform
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_OPENGL: software
          QT_QPA_PLATFORM: offscreen
          QT_X11_NO_MITSHM: "1"
        run: |
          set -o pipefail
          mkdir -p qt-logs
          xvfb-run -a -s "-screen 0 1280x1024x24" python -c "import platform; import PySide6; from PySide6.QtCore import qVersion; from PySide6.QtWidgets import QApplication; app = QApplication([]); print('qt-platform', app.platformName(), 'python', platform.python_version(), 'pyside', PySide6.__version__, 'qt', qVersion())" | tee qt-logs/versions.txt
          test -s qt-logs/versions.txt

      - name: Genuine QThread shutdown, deadline, and publisher negatives
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_OPENGL: software
          QT_QPA_PLATFORM: offscreen
          QT_X11_NO_MITSHM: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest \
            tests/ui/test_qt_shutdown.py \
            tests/unit/test_qt_lifetime_contract.py \
            tests/unit/test_pytest_totals.py \
            tests/unit/test_qt_evidence.py

      - name: Offscreen workbench tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_OPENGL: software
          QT_QPA_PLATFORM: offscreen
          QT_X11_NO_MITSHM: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: python tools/qt_workbench.py

      - name: Qt stability qualification
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_OPENGL: software
          QT_QPA_PLATFORM: offscreen
          QT_X11_NO_MITSHM: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: python tools/qt_stability.py --repeats 15

      - name: Clean-install smoke
        run: python tools/release_smoke.py

      - name: Verify Qt evidence archive
        if: always()
        run: python tools/qt_evidence.py qt-logs --write --repeats 15

      - name: Publish Ubuntu 26.04 Qt evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-ubuntu-2604-logs
          path: qt-logs/
          if-no-files-found: error
