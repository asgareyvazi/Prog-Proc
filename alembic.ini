[alembic]
script_location = migrations
prepend_sys_path = src
# Alembic >= 1.16 deprecates inferring how to split prepend_sys_path; without this it warns
# about legacy space/comma/colon splitting on every programmatic Config() use.  `os` is the
# documented default and changes nothing here, since the value above is a single path.
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# sqlalchemy.url is intentionally unset: migrations/env.py resolves the URL from
# DRILLINTEL_DATABASE__URL, the active config file, or an explicit -x url=...
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
